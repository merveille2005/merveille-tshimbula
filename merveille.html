<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat et Suggestions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        #chatBox {
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            background-color: #fff;
            margin: 10px;
            border-radius: 8px;
        }
        .message {
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            background-color: #e6e6e6;
            max-width: 60%;
        }
        .user-message {
            background-color: #d1e7fd;
            text-align: right;
        }
        .message-time {
            font-size: 12px;
            color: #aaa;
            display: block;
        }
        .social-suggestion {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            width: 80%;
            max-width: 400px;
        }
        .social-buttons button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .whatsapp-btn {
            background-color: #25D366;
            color: white;
        }
        .instagram-btn {
            background-color: #E4405F;
            color: white;
        }
        .close-suggestion {
            position: absolute;
            top: 5px;
            right: 5px;
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
        }
        #messageInput {
            width: 70%;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        #sendButton {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #sendButton:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div id="chatBox"></div>

<input type="text" id="messageInput" placeholder="Tapez votre message...">
<button id="sendButton" onclick="sendMessage()">Envoyer</button>

<script>
    let messageCount = 0;
    let socialSuggestionShown = false;

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        
        if (message === '') return;  // Ne rien faire si le message est vide

        // Affichage du message de l'utilisateur
        const chatBox = document.getElementById('chatBox');
        const userMsg = document.createElement('div');
        userMsg.className = 'message user-message';
        
        const now = new Date();
        const timeStr = now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
        
        userMsg.innerHTML = message + '<span class="message-time">' + timeStr + '</span>';
        chatBox.appendChild(userMsg);
        
        // Vider le champ de saisie après l'envoi
        input.value = '';

        // Incrémenter le nombre de messages envoyés
        messageCount++;

        // Afficher la suggestion après 5 messages
        if (messageCount >= 5 && !socialSuggestionShown) {
            socialSuggestionShown = true;
            showSocialSuggestion();
        }

        // Faire défiler le chat vers le bas
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showSocialSuggestion() {
        const suggestion = document.createElement('div');
        suggestion.className = 'social-suggestion';
        suggestion.innerHTML = `
            <h4><i class="fas fa-share-alt"></i> Rejoignez-nous sur les réseaux sociaux</h4>
            <div class="social-buttons">
                <button class="social-btn whatsapp-btn"><i class="fab fa-whatsapp"></i> WhatsApp</button>
                <button class="social-btn instagram-btn"><i class="fab fa-instagram"></i> Instagram</button>
            </div>
            <button class="close-suggestion" onclick="closeSocialSuggestion()">×</button>
        `;
        document.body.appendChild(suggestion);
    }

    function closeSocialSuggestion() {
        const suggestion = document.querySelector('.social-suggestion');
        if (suggestion) {
            suggestion.remove();
        }
    }
</script>

</body>
</html>
